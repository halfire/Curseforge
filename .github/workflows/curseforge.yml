# Envoie les addons de ce dépôt sur CurseForge quand pack.json change sur main.
# Réglages du dépôt GitHub : secret CF_API_KEY et CF_PROJECT_ID (variable ou secret) ; sans eux, l'envoi échoue.
name: Pack CurseForge
on:
  push:
    branches: [main]
    paths: ['pack.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: curseforge
  cancel-in-progress: false
jobs:
  upload:
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Envoyer le pack
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY || secrets.CURSEFORGE }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID || secrets.CF_PROJECT_ID }}
          CF_GAME_VERSIONS: ${{ vars.CF_GAME_VERSIONS || secrets.CF_GAME_VERSIONS }}
        run: python3 .github/scripts/curseforge_upload.py .
